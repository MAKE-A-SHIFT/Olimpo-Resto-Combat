<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú Oficial Completo • Restaurante del Olimpo</title>
  <style>
    @page {
      size: 1080px 1920px;
      margin: 0;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #000000;
      width: 1080px;
    }
    .pdf-page {
      width: 1080px;
      height: 1920px;
      page-break-after: always;
      break-after: page;
      position: relative;
      overflow: hidden;
      background: #0b1114;
    }
    .pdf-page img {
      width: 1080px;
      height: 1920px;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="pdf-page">
    <img src="../story_1_lanzamiento.png" alt="Menú Olimpo - Página 1: Sistema de Suscripción & 4 Objetivos">
  </div>
  <div class="pdf-page">
    <img src="../story_2_pack_atleta.png" alt="Menú Olimpo - Página 2: Carta de la Semana Lunes a Miércoles">
  </div>
  <div class="pdf-page">
    <img src="../story_3_almuerzos.png" alt="Menú Olimpo - Página 3: Carta de la Semana Jueves a Sábado">
  </div>
  <div class="pdf-page">
    <img src="../story_4_recuperacion.png" alt="Menú Olimpo - Página 4: Comida Rápida & Bebidas Funcionales">
  </div>
  <div class="pdf-page">
    <img src="../story_5_oferta_especial.png" alt="Menú Olimpo - Página 5: Programa de Embajadores & Horarios">
  </div>
</body>
</html>
